        fill="none" stroke="#ffd0f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>
  <g fill="#ff4fd8" opacity=".85">
    <circle cx="140" cy="52" r="3"/><circle cx="56" cy="86" r="2.5"/>
    <circle cx="150" cy="150" r="2.5"/><circle cx="46" cy="146" r="3"/>
  </g>
</svg>
