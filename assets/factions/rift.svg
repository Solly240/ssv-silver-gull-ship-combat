<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Rift vessel marker">
  <defs>
    <radialGradient id="rf-void" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a0d3d"/><stop offset="70%" stop-color="#0a0414"/><stop offset="100%" stop-color="#05020a"/>
    </radialGradient>
    <linearGradient id="rf-tear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff4fd8"/><stop offset="55%" stop-color="#b06bf0"/><stop offset="100%" stop-color="#5a2f8a"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="96" fill="url(#rf-void)" stroke="#b06bf0" stroke-width="3"/>
